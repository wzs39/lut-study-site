name: Upload Lecture Notes / Chapter Material
description: Submit lecture slides, PDFs, or Markdown notes for a specific course chapter.
title: "[Material] "
labels: ["material-upload"]
body:
  - type: input
    id: course_id
    attributes:
      label: Course ID / 课程编号
      placeholder: "e.g., 30352 (CT60A0250 编程基础)"
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter / 对应章节
      placeholder: "e.g., 第 2 章 · 字符串与控制流 (part-2)"
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Files or Markdown Notes / 资料文件或笔记内容
      description: Drag & drop PDF/PPTX/DOCX/image files directly into this box, or paste Markdown notes.
    validations:
      required: true
